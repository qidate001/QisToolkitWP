<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; font-family: 'Segoe UI', sans-serif; padding: 15px; background: #1a1a2e; color: #cdd6f4; }
    h2 { font-size: 16px; margin-top: 0; color: #e0e0e0; border-bottom: 1px solid #2a2a3e; padding-bottom: 10px; }
    .setting-group { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    input { width: 100px; padding: 6px; border-radius: 6px; border: 1px solid #45475a; background: #0f0f1a; color: #cdd6f4; outline: none; }
    input:focus { border-color: #4a90e2; }
    button { width: 100%; padding: 10px; background: #4a90e2; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 10px; transition: 0.2s; font-weight: 500; }
    button:hover { background: #357abd; }
    .btn-save { background: #2a2a3e; border: 1px solid #45475a; }
    .btn-save:hover { background: #313244; }
    #status { margin-top: 12px; font-size: 12px; color: #a0aec0; text-align: center; min-height: 16px; }
  </style>
</head>
<body>
  <h2>⚙️ QisToolkit WP</h2>
  
  <div class="setting-group">
    <span>快捷键:</span>
    <input type="text" id="input-hotkey" placeholder="如: Home 或 Ctrl+D">
  </div>
  <div class="setting-group">
    <span>本地端口:</span>
    <input type="number" id="input-port" placeholder="18888">
  </div>

  <button id="btn-save" class="btn-save">保存设置</button>
  <button id="btn-send">发送当前视频到 QisToolkit3</button>
  
  <div id="status">准备就绪</div>
  <script src="popup.js"></script>
</body>
</html>
